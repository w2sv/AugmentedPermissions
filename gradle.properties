# ======= Gradle =======
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# ======= Kotlin =======
kotlin.code.style=official

# ======= Android =======
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.viewbinding=false

# ======= Publishing =======
systemProp.org.gradle.internal.publish.checksums.insecure=true
systemProp.org.gradle.internal.http.socketTimeout=120000

# Coordinates
GROUP=io.github.w2sv

POM_NAME=AugmentedPermissions
POM_DESCRIPTION=Augmented permission-state utilities for Jetpack Compose
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/w2sv/AugmentedPermissions

# Project info
POM_SCM_URL=https://github.com/w2sv/AugmentedPermissions
POM_SCM_CONNECTION=scm:git:git://github.com/w2sv/AugmentedPermissions.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/w2sv/AugmentedPermissions.git

# License
POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

# Developer
POM_DEVELOPER_ID=w2sv
POM_DEVELOPER_NAME=Janek Zangenberg
POM_DEVELOPER_URL=https://github.com/w2sv

mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
signAllPublications=true
